# Reproducible experiment manifest template.
# Replace every PLACEHOLDER before running an experiment.
experiment:
  id: PLACEHOLDER_EXPERIMENT_ID
  created_at: PLACEHOLDER_ISO8601_TIMESTAMP
  source_commit: PLACEHOLDER_GIT_COMMIT
  purpose: PLACEHOLDER_RESEARCH_QUESTION

model:
  provider: PLACEHOLDER_PROVIDER_ID
  model_id: PLACEHOLDER_EXACT_MODEL_ID
  revision: PLACEHOLDER_IMMUTABLE_REVISION_OR_PROVIDER_ALIAS
  tokenizer: PLACEHOLDER_TOKENIZER_ID_AND_REVISION
  operation: PLACEHOLDER_HOSTED_INFERENCE_OR_LOCAL_TRAINING

data:
  dataset_release: PLACEHOLDER_DATASET_VERSION
  checksum: PLACEHOLDER_SHA256
  split: PLACEHOLDER_SPLIT_VERSION

runtime:
  python: PLACEHOLDER_VERSION
  framework: PLACEHOLDER_VERSION
  hardware: PLACEHOLDER_HARDWARE
  seed: PLACEHOLDER_INTEGER
  config_file: PLACEHOLDER_CONFIG_PATH
  config_sha256: PLACEHOLDER_SHA256

evaluation:
  benchmark: PLACEHOLDER_BENCHMARK_VERSION
  rubric: PLACEHOLDER_RUBRIC_VERSION
  languages:
    - PLACEHOLDER_LANGUAGE_CODES
  report_path: PLACEHOLDER_REPORT_PATH
